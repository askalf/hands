# Path → label map for .github/workflows/pr-triage.yml (actions/labeler v7).
#
# Additive only: sync-labels is off, so nothing here ever strips a label a
# human — or Dependabot — put on a PR by hand. Add a path, get a label.
#
# Bare-noun labels, matching the Own Your Stack family vocabulary (redstamp is
# the reference), so a reader moving between repos sees the same words.

cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/cli.ts'
          - 'src/cli-mode.ts'
          - 'src/cli-record.ts'
          - 'src/cli-stream.ts'

daemon:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/daemon-ctl.ts'
          - 'src/daemon-run.ts'
          - 'src/jobs.ts'

mcp:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/mcp-server.ts'

macros:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/macros.ts'
          - 'src/macro-run.ts'
          - 'src/personas.ts'
          - 'src/learn.ts'

audit:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/audit-replay.ts'
          - 'src/audit-stats.ts'

auth:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/auth.ts'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - '**/*.test.mjs'

fuzz:
  - changed-files:
      - any-glob-to-any-file:
          - 'fuzz/**'
          - '.clusterfuzzlite/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CHANGELOG.md'
          - 'CONTRIBUTING.md'
          - 'CODE_OF_CONDUCT.md'
          - 'SECURITY.md'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/pull_request_template.md'

